plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.workspace'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Runtime availability can change without source changes (for example after a reboot).
	// Never reuse a skipped compatibility result when either opt-in check is requested.
	def codexExecutable = providers.environmentVariable('WORKSPACE_CODEX_TEST_EXECUTABLE').orElse('')
	def dockerExecutable = providers.environmentVariable('WORKSPACE_DOCKER_TEST_EXECUTABLE').orElse('')
	inputs.property('codexCompatibilityExecutable', codexExecutable)
	inputs.property('dockerCompatibilityExecutable', dockerExecutable)
	inputs.property('dockerCompatibilityContext', providers.environmentVariable('WORKSPACE_DOCKER_CONTEXT').orElse(''))
	outputs.upToDateWhen { codexExecutable.get().isEmpty() && dockerExecutable.get().isEmpty() }
}
