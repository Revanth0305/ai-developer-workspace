spring.application.name=ai-developer-workspace
server.address=127.0.0.1
server.port=${WORKSPACE_PORT:8080}
spring.datasource.url=jdbc:h2:file:${WORKSPACE_DATA_DIR:./data}/workspace;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
workspace.platform-root=${WORKSPACE_PLATFORM_ROOT:..}
spring.jackson.serialization.indent-output=true
workspace.codex.executable=${WORKSPACE_CODEX_EXECUTABLE:codex}
workspace.codex.enabled=${WORKSPACE_CODEX_ENABLED:false}
workspace.codex.timeout-seconds=${WORKSPACE_CODEX_TIMEOUT_SECONDS:240}
workspace.execution.enabled=${WORKSPACE_EXECUTION_ENABLED:false}
workspace.git.enabled=${WORKSPACE_GIT_ENABLED:false}
workspace.deployment.enabled=${WORKSPACE_DEPLOYMENT_ENABLED:false}
workspace.git.gh-executable=${WORKSPACE_GH_EXECUTABLE:gh}
workspace.execution.docker-executable=${WORKSPACE_DOCKER_EXECUTABLE:docker}
workspace.execution.docker-context=${WORKSPACE_DOCKER_CONTEXT:}
